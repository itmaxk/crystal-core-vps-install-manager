<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1245"/>
      <stop offset="1" stop-color="#071f2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D1B2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00D1B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="1" stop-color="#4b2db8"/>
    </linearGradient>
    <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ff0d2"/>
      <stop offset="1" stop-color="#00917c"/>
    </linearGradient>
    <linearGradient id="tL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ccff"/>
      <stop offset="1" stop-color="#9b7dff"/>
    </linearGradient>
    <linearGradient id="tR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9fff5"/>
      <stop offset="1" stop-color="#4fe6cc"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3460"/>
      <stop offset="1" stop-color="#1b2142"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="190" rx="170" ry="150" fill="url(#glow)"/>

  <!-- кристалл -->
  <g stroke="#0d0a24" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round">
    <polygon points="256,44 176,118 256,160" fill="url(#tL)"/>
    <polygon points="256,44 336,118 256,160" fill="url(#tR)"/>
    <polygon points="176,118 256,160 256,298 176,232" fill="url(#fL)"/>
    <polygon points="336,118 256,160 256,298 336,232" fill="url(#fR)"/>
  </g>
  <polyline points="196,128 256,162 316,128" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <line x1="200" y1="140" x2="200" y2="218" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
  <polygon points="256,44 226,72 256,92" fill="#ffffff" fill-opacity="0.55"/>

  <!-- отражение кристалла на сервере -->
  <ellipse cx="256" cy="322" rx="92" ry="9" fill="#00D1B2" fill-opacity="0.35"/>

  <!-- VPS: два юнита стойки -->
  <g>
    <rect x="128" y="332" width="256" height="56" rx="14" fill="url(#unit)" stroke="#4a5590" stroke-width="2"/>
    <circle cx="160" cy="360" r="7" fill="#04B575"/>
    <circle cx="184" cy="360" r="7" fill="#00D1B2"/>
    <g stroke="#6c78b8" stroke-width="5" stroke-linecap="round">
      <line x1="262" y1="350" x2="356" y2="350"/>
      <line x1="262" y1="370" x2="356" y2="370"/>
    </g>

    <rect x="128" y="400" width="256" height="56" rx="14" fill="url(#unit)" stroke="#4a5590" stroke-width="2"/>
    <circle cx="160" cy="428" r="7" fill="#04B575"/>
    <circle cx="184" cy="428" r="7" fill="#7D56F4"/>
    <g stroke="#6c78b8" stroke-width="5" stroke-linecap="round">
      <line x1="262" y1="418" x2="356" y2="418"/>
      <line x1="262" y1="438" x2="356" y2="438"/>
    </g>
  </g>
</svg>
